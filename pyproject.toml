[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nr-mcp"
version = "1.2.0"
description = "MCP server for Node-RED — safe deploy with optimistic locking, smart search, full flow management via AI assistants"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Bartosz Zymon", email = "bartosz@nxtassist.ai" },
]
readme = "README.md"
keywords = ["mcp", "node-red", "ai", "claude", "automation", "iot", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Texan-NXTassist/nr-mcp"
Repository = "https://github.com/Texan-NXTassist/nr-mcp"
Issues = "https://github.com/Texan-NXTassist/nr-mcp/issues"
Changelog = "https://github.com/Texan-NXTassist/nr-mcp/blob/main/CHANGELOG.md"

[project.scripts]
nr-mcp = "nr_mcp.server:main"
