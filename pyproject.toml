[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nr-mcp"
version = "1.0.0"
description = "Custom MCP server for Node-RED — fixes PUT /flow/:id tab reorder bug, adds smart search and safe deploy"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
nr-mcp = "nr_mcp.server:main"
